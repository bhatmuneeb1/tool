[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repoguard-local"
version = "0.1.0"
description = "Dependency-free local repository security hygiene scanner"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Muneeb Amin Bhat"}]
keywords = ["security", "sast", "secrets", "github-actions", "devsecops"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.scripts]
repoguard = "repoguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
